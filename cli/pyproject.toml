[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-cli"
version = "0.1.0"
description = "Atlas CLI — first-class programmatic interface to the Atlas control plane."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "atlas-sdk>=0.1.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.16.0",
    "mypy>=2.0.0",
    "atlas-sdk>=0.1.0",
]

[project.scripts]
atlas = "cli.app:entrypoint"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
