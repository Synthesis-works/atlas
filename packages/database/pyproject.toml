[tool.poetry]
name = "atlas-db"
version = "0.1.0"
description = "Database Foundation for Project Atlas"
authors = ["Atlas Team"]
readme = "README.md"
packages = [{include = "atlas_db"}]

[tool.poetry.dependencies]
python = "^3.11"
sqlalchemy = { version = "^2.0.0", extras = ["asyncio"] }
alembic = "^1.13.0"
pydantic = "^2.0.0"
psycopg = { version = "^3.1.0", extras = ["binary"] }
pydantic-settings = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
