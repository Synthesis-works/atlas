name: atlas-cli CI

on:
  push:
    branches: [ "main", "feature/**" ]
    paths:
      - "cli/**"
      - "sdk/python/**"
      - "packages/llm/**"
      - "scripts/build_cli_dist.py"
      - "scripts/validate_cli_dist.py"
      - ".github/workflows/cli.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "cli/**"
      - "sdk/python/**"
      - "packages/llm/**"
      - "scripts/build_cli_dist.py"
      - "scripts/validate_cli_dist.py"
      - ".github/workflows/cli.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install CLI + SDK (editable)
      run: |
        python -m pip install --upgrade pip
        pip install -e "./cli[dev]" -e "./sdk/python[dev]"

    - name: Get changed Python files
      id: changed-py
      run: |
        CHANGED=""
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD -- '*.py' | tr '\n' ' ')
        else
          git fetch --depth=1 origin main >/dev/null 2>&1 || true
          CHANGED=$(git diff --name-only origin/main...HEAD -- '*.py' | tr '\n' ' ')
        fi
        echo "changed_py=${CHANGED}" >> "$GITHUB_OUTPUT"

    - name: Run Ruff (lint) on CLI + SDK
      run: ruff check cli sdk/python packages/llm scripts/build_cli_dist.py scripts/validate_cli_dist.py

    - name: Run Ruff (format) on changed Python files
      run: |
        if [ -n "${{ steps.changed-py.outputs.changed_py }}" ]; then
          ruff format --check ${{ steps.changed-py.outputs.changed_py }}
        else
          echo "no changed python files to format-check"
        fi

    - name: Run Mypy on CLI + SDK packages
      # Run per project directory so module resolution uses that project's
      # package root. Running from the repo root would resolve `cli` to the
      # repo-root namespace directory and fail with `Module "cli" has no
      # attribute "__version__"` (and worse, pull unrelated test files under
      # each project's strict mypy config).
      run: |
        if [ -n "${{ steps.changed-py.outputs.changed_py }}" ]; then
          (cd cli && mypy cli)
          (cd sdk/python && mypy atlas_sdk)
        else
          echo "no changed python files to type-check"
        fi

    - name: Run SDK tests
      run: pytest -q tests
      working-directory: sdk/python

    - name: Run CLI tests
      run: pytest -q tests
      working-directory: cli

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Build wheel + sdist via staging
      run: python scripts/build_cli_dist.py --out-dir dist/artifacts

    - name: Validate wheel + sdist in fresh venvs
      run: python scripts/validate_cli_dist.py --dist-dir dist/artifacts

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: atlas-cli-dist
        path: dist/artifacts/*.whl
        if-no-files-found: error

    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: atlas-cli-sdist
        path: dist/artifacts/*.tar.gz
        if-no-files-found: error