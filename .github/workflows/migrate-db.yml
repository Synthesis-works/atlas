name: Migrate Production Database

# Applies pending Alembic migrations to the production database whenever code
# lands on main. Production migrations were previously manual-only, which let
# `executions.idempotency_key` (and future columns) drift out of sync with the
# deployed API until a runtime error surfaced it. This workflow runs the same
# operator command documented in docs/PRODUCTION_READINESS_PLAN.md against the
# production connection string. `alembic upgrade head` is idempotent, so
# repeated runs are cheap no-ops when nothing is pending.
#
# Safety:
# - Runs only when PROD_DATABASE_URL is configured as a repo secret. Secrets
#   cannot be referenced inside `if:` conditions, so the value is mapped into
#   the workflow-level `env` first and the job/step conditions inspect that.
# - Serialized by a concurrency group so two pushes cannot race each other.
# - Configure PROD_DATABASE_URL with the Supabase SESSION-mode pooler (port
#   5432, IPv4, free plan) or the IPv4 direct URL (paid plans); never the
#   transaction-mode pooler (port 6543), which breaks Alembic DDL.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

concurrency:
  group: migrate-db
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ env.PROD_DATABASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ env.PROD_DATABASE_URL }}
        run: |
          uv run alembic -c packages/database/alembic.ini upgrade head

      - name: Report revision
        env:
          DATABASE_URL: ${{ env.PROD_DATABASE_URL }}
        run: |
          uv run alembic -c packages/database/alembic.ini current