name: Benchmark Execute (INERT)

# ⚠️ INERT BY DESIGN — DO NOT ENABLE WITHOUT EXPLICIT APPROVAL ⚠️
#
# This workflow is the future GitHub-Actions execution plane. It stays
# non-operational until BOTH of the following are true:
#
#   1. Repository variable BENCHMARK_EXECUTION_ENABLED is set to "true"
#      (Settings -> Secrets and variables -> Actions -> Variables).
#   2. The execution-plane decision is approved after reviewing:
#      - GitHub Actions Terms-of-Service implications,
#      - public-log exposure of benchmark prompts/outputs,
#      - secret handling for provider keys and DATABASE_URL.
#
# Until then, every dispatch exits immediately at the guard step.
# Design doc: docs/ZERO_BUDGET_EXECUTION_PLANE.md

on:
  repository_dispatch:
    types: [benchmark-execute]
  workflow_dispatch:
    inputs:
      execution_id:
        description: "Execution UUID to run"
        required: true

permissions:
  contents: read

concurrency:
  group: benchmark-execute
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Execution-plane enablement guard
        env:
          ENABLED: ${{ vars.BENCHMARK_EXECUTION_ENABLED }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            echo "ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "::notice::Benchmark execution plane is DISABLED."
            echo "::notice::Set repo variable BENCHMARK_EXECUTION_ENABLED=true only after formal approval."
          fi

      - uses: actions/checkout@v4
        if: env.ENABLED == 'true'

      - name: Set up Python
        if: env.ENABLED == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        if: env.ENABLED == 'true'
        run: pipx install uv

      - name: Sync dependencies
        if: env.ENABLED == 'true'
        run: uv sync --no-dev

      - name: Pull benchmark image
        if: env.ENABLED == 'true'
        run: docker pull "${ATLAS_BENCHMARK_IMAGE:-ghcr.io/${{ github.repository }}/atlas-benchmark-runner:latest}"

      - name: Run benchmark execution
        if: env.ENABLED == 'true'
        env:
          ENVIRONMENT: production
          DATABASE_URL: ${{ secrets.EXECUTION_DATABASE_URL }}
          ATLAS_BENCHMARK_IMAGE: ghcr.io/${{ github.repository }}/atlas-benchmark-runner:sha-${{ github.sha }}
          ATLAS_BENCHMARK_NETWORK: bridge
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          EXEC_ID="${{ github.event.client_payload.execution_id || inputs.execution_id }}"
          uv run python scripts/run_execution_ci.py "$EXEC_ID" "gh-${{ github.run_id }}"
