name: Benchmark Execution (GitHub Actions backend)

# Production execution plane: Atlas dispatches repository_dispatch events of
# type "benchmark-execution"; this workflow runs the REAL production code path
# on a GitHub-hosted runner and writes results/provenance directly to the
# Atlas database.
#
# Security model:
# - client_payload carries ONLY opaque identifiers (execution_id,
#   correlation_id). Payload values are validated as UUIDs before use and are
#   passed via environment variables, never interpolated into shell commands.
# - Provider keys come from Actions secrets and reach the benchmark container
#   only through the driver-side allow-list (_provider_env); the container
#   never sees DATABASE_URL or JWT_SECRET.
# - The claim step makes duplicate/stale dispatches fail fast instead of
#   double-executing.

on:
  repository_dispatch:
    types: [benchmark-execution]
  workflow_dispatch:
    inputs:
      execution_id:
        description: "Existing QUEUED execution UUID (must have no active attempt)"
        required: true
        type: string

concurrency:
  # Serialize executions per execution id; queued runs are cancelled rather
  # than piling up (Atlas-level retries re-dispatch instead).
  group: benchmark-${{ github.event.client_payload.execution_id || inputs.execution_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    env:
      EXECUTION_ID: ${{ github.event.client_payload.execution_id || inputs.execution_id }}
      CORRELATION_ID: ${{ github.event.client_payload.correlation_id || format('manual-{0}', github.run_id) }}
      GH_RUN_ID: ${{ github.run_id }}
      RUNNER_LABEL: ubuntu-24.04
      ENVIRONMENT: production
      ATLAS_BENCHMARK_IMAGE: atlas-benchmark-runner:${{ github.run_id }}
      ATLAS_BENCHMARK_NETWORK: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate payload execution_id
        run: |
          if ! echo "$EXECUTION_ID" | grep -qE '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "::error::EXECUTION_ID is not a valid UUID; refusing to execute"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build benchmark runner image
        run: |
          start=$(date +%s%3N)
          docker build -f docker/benchmark/Dockerfile -t "$ATLAS_BENCHMARK_IMAGE" .
          docker image inspect "$ATLAS_BENCHMARK_IMAGE" --format 'built {{.Id}}'
          echo "IMAGE_BUILD_MS=$(( $(date +%s%3N) - start ))" >> "$GITHUB_ENV"

      - name: Claim attempt for this run
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          uv run python scripts/gh_claim_attempt.py \
            --execution-id "$EXECUTION_ID" \
            --run-id "$GH_RUN_ID" \
            --runner "$RUNNER_LABEL"

      - name: Execute via production code path
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          start=$(date +%s%3N)
          uv run python scripts/run_execution_ci.py \
            "$EXECUTION_ID" "$CORRELATION_ID"
          echo "EXECUTE_MS=$(( $(date +%s%3N) - start ))" >> "$GITHUB_ENV"

      - name: Confirm no benchmark containers left behind
        if: always()
        run: |
          leftovers=$(docker ps -a --filter "label=atlas.benchmark=true" -q | wc -l)
          echo "benchmark containers remaining: $leftovers"
          test "$leftovers" -eq 0 || {
            docker ps -a --filter "label=atlas.benchmark=true"
            exit 1
          }
