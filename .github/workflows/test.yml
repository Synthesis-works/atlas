name: Test and Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Run Ruff (Lint & Format)
      run: ruff check . && ruff format --check .
      
    - name: Run Mypy
      run: |
        mypy packages
        mypy services/dataset
        MYPYPATH=services/evaluation-service mypy services/evaluation-service
        MYPYPATH=services/execution-service mypy services/execution-service
        mypy services/report
      
    - name: Run tests with Pytest
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas_test
      run: pytest
