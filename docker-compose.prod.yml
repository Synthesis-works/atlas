version: '3.8'

x-backend-base: &backend-base
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
  env_file:
    - .env
  environment:
    - ENVIRONMENT=production
    - DEBUG=false
    - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/atlas
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/0
    - JWT_SECRET=${JWT_SECRET}
    - LOG_LEVEL=INFO
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: always

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: atlas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  api:
    <<: *backend-base
    command: bash -c "python -m alembic -c packages/database/alembic.ini upgrade head && uvicorn apps.backend.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend-base
    command: celery -A apps.backend.worker.celery_app worker --loglevel=INFO

  scheduler:
    <<: *backend-base
    command: celery -A apps.backend.worker.celery_app beat --loglevel=INFO



volumes:
  postgres_data:
  redis_data:
